<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SentinentX — Voice Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg-deep:       #030508;
    --bg-panel:      #080d14;
    --bg-card:       #0b1120;
    --cyan:          #00d4ff;
    --cyan-dim:      #00d4ff44;
    --cyan-glow:     #00d4ff22;
    --purple:        #7c3aed;
    --purple-dim:    #7c3aed44;
    --red:           #ff3b5c;
    --red-dim:       #ff3b5c44;
    --green:         #00ff88;
    --text:          #d8e8f0;
    --text-dim:      #3a5060;
    --text-muted:    #1e3040;
    --border:        #0e2030;
    --border-bright: #1a3a50;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg-deep);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    overflow: hidden;
  }

  /* ── Noise texture overlay ── */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: 0.4;
  }

  /* ── Scanline effect ── */
  body::after {
    content: '';
    position: fixed; inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,212,255,0.012) 2px,
      rgba(0,212,255,0.012) 4px
    );
    pointer-events: none;
    z-index: 0;
  }

  #app {
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-rows: 56px 1fr 48px;
    grid-template-columns: 1fr 1fr;
    height: 100vh;
    gap: 0;
  }

  /* ═══════════════════════════════════
     HEADER
  ═══════════════════════════════════ */
  header {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(90deg, #040810 0%, #060d18 50%, #040810 100%);
    position: relative;
  }

  header::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--cyan), transparent);
    opacity: 0.5;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo-icon {
    width: 28px; height: 28px;
    position: relative;
  }

  .logo-icon svg {
    width: 100%; height: 100%;
    filter: drop-shadow(0 0 6px var(--cyan));
  }

  .logo-text {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: 1.2rem;
    letter-spacing: 6px;
    color: var(--cyan);
    text-shadow: 0 0 20px var(--cyan), 0 0 40px var(--cyan-dim);
    animation: flicker 8s infinite;
  }

  .logo-sub {
    font-size: 0.55rem;
    letter-spacing: 3px;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-top: -2px;
  }

  @keyframes flicker {
    0%, 95%, 100% { opacity: 1; }
    96% { opacity: 0.85; }
    97% { opacity: 1; }
    98% { opacity: 0.9; }
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 24px;
  }

  .connection-indicator {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.65rem;
    letter-spacing: 2px;
    color: var(--text-dim);
  }

  .conn-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--text-muted);
    transition: all 0.4s ease;
  }

  .conn-dot.connected {
    background: var(--green);
    box-shadow: 0 0 10px var(--green), 0 0 20px rgba(0,255,136,0.3);
    animation: pulse-dot 2s infinite;
  }

  .conn-dot.error { background: var(--red); box-shadow: 0 0 10px var(--red); }

  @keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.6; transform: scale(0.8); }
  }

  .clear-btn {
    background: none;
    border: 1px solid var(--border-bright);
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 2px;
    padding: 5px 12px;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
  }

  .clear-btn:hover {
    border-color: var(--cyan-dim);
    color: var(--cyan);
    box-shadow: 0 0 10px var(--cyan-glow);
  }

  /* ═══════════════════════════════════
     LEFT PANEL — VOICE CORE
  ═══════════════════════════════════ */
  .voice-panel {
    grid-column: 1;
    grid-row: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
    padding: 32px;
    border-right: 1px solid var(--border);
    position: relative;
    overflow: hidden;
  }

  /* Background grid */
  .voice-panel::before {
    content: '';
    position: absolute; inset: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 40px 40px;
    opacity: 0.3;
    mask-image: radial-gradient(ellipse 60% 60% at 50% 50%, black 40%, transparent 100%);
  }

  /* ── ORB ── */
  .orb-container {
    position: relative;
    width: 220px; height: 220px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Rotating rings */
  .ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid transparent;
  }

  .ring-1 {
    width: 220px; height: 220px;
    border-color: var(--cyan-dim);
    animation: rotate-cw 12s linear infinite;
    border-top-color: var(--cyan);
    filter: drop-shadow(0 0 3px var(--cyan));
  }

  .ring-2 {
    width: 190px; height: 190px;
    border-color: var(--purple-dim);
    animation: rotate-ccw 9s linear infinite;
    border-right-color: var(--purple);
    filter: drop-shadow(0 0 3px var(--purple));
  }

  .ring-3 {
    width: 160px; height: 160px;
    border-color: var(--cyan-dim);
    animation: rotate-cw 6s linear infinite;
    border-bottom-color: rgba(0,212,255,0.6);
  }

  @keyframes rotate-cw  { from { transform: rotate(0deg);   } to { transform: rotate(360deg);  } }
  @keyframes rotate-ccw { from { transform: rotate(0deg);   } to { transform: rotate(-360deg); } }

  /* Orb core */
  .orb-core {
    position: absolute;
    width: 110px; height: 110px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%,
      rgba(0, 212, 255, 0.25) 0%,
      rgba(124, 58, 237, 0.15) 50%,
      rgba(3, 5, 8, 0.9) 80%
    );
    box-shadow:
      0 0 30px rgba(0,212,255,0.2),
      0 0 60px rgba(0,212,255,0.1),
      inset 0 0 30px rgba(0,212,255,0.05);
    animation: orb-breathe 4s ease-in-out infinite;
    transition: all 0.5s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: default;
  }

  .orb-core svg {
    width: 36px; height: 36px;
    opacity: 0.7;
    filter: drop-shadow(0 0 8px var(--cyan));
  }

  @keyframes orb-breathe {
    0%, 100% {
      box-shadow: 0 0 30px rgba(0,212,255,0.2), 0 0 60px rgba(0,212,255,0.08), inset 0 0 20px rgba(0,212,255,0.05);
      transform: scale(1);
    }
    50% {
      box-shadow: 0 0 50px rgba(0,212,255,0.35), 0 0 100px rgba(0,212,255,0.15), inset 0 0 30px rgba(0,212,255,0.08);
      transform: scale(1.04);
    }
  }

  /* State-specific orb styles */
  .orb-core.listening {
    animation: orb-listen 0.8s ease-in-out infinite;
    background: radial-gradient(circle at 35% 35%,
      rgba(255, 59, 92, 0.35) 0%,
      rgba(255, 59, 92, 0.15) 50%,
      rgba(3, 5, 8, 0.9) 80%
    );
    box-shadow:
      0 0 40px rgba(255,59,92,0.4),
      0 0 80px rgba(255,59,92,0.2),
      inset 0 0 30px rgba(255,59,92,0.1);
  }

  @keyframes orb-listen {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }

  .orb-core.thinking {
    animation: orb-think 1.5s linear infinite;
  }

  @keyframes orb-think {
    0% { filter: hue-rotate(0deg); }
    100% { filter: hue-rotate(360deg); }
  }

  .orb-core.speaking {
    animation: orb-speak 0.5s ease-in-out infinite alternate;
    box-shadow:
      0 0 50px rgba(0,212,255,0.5),
      0 0 100px rgba(0,212,255,0.25),
      inset 0 0 40px rgba(0,212,255,0.1);
  }

  @keyframes orb-speak {
    from { transform: scale(1); }
    to   { transform: scale(1.06); }
  }

  /* Ripple waves (for speaking state) */
  .ripples {
    position: absolute;
    width: 110px; height: 110px;
    border-radius: 50%;
  }

  .ripple {
    position: absolute; inset: 0;
    border-radius: 50%;
    border: 1px solid var(--cyan);
    opacity: 0;
  }

  .ripple-1 { animation: ripple-out 2.4s ease-out infinite 0s; }
  .ripple-2 { animation: ripple-out 2.4s ease-out infinite 0.8s; }
  .ripple-3 { animation: ripple-out 2.4s ease-out infinite 1.6s; }

  @keyframes ripple-out {
    0%   { transform: scale(1);   opacity: 0.6; }
    100% { transform: scale(2.8); opacity: 0; }
  }

  .ripples.hidden .ripple { animation: none; opacity: 0; }

  /* ── Status text ── */
  .status-display {
    text-align: center;
  }

  .status-state {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.75rem;
    letter-spacing: 4px;
    color: var(--cyan);
    text-transform: uppercase;
    text-shadow: 0 0 10px var(--cyan);
    min-height: 18px;
    transition: all 0.3s ease;
  }

  .status-hint {
    font-size: 0.6rem;
    letter-spacing: 2px;
    color: var(--text-dim);
    margin-top: 4px;
  }

  /* ── Mic Button ── */
  .mic-btn {
    position: relative;
    width: 72px; height: 72px;
    border-radius: 50%;
    border: 2px solid var(--cyan-dim);
    background: linear-gradient(145deg, #0d1f2d, #050c14);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.25s ease;
    box-shadow: 0 0 20px var(--cyan-glow), inset 0 0 15px rgba(0,0,0,0.5);
    outline: none;
  }

  .mic-btn:hover {
    border-color: var(--cyan);
    box-shadow: 0 0 30px var(--cyan-dim), inset 0 0 15px rgba(0,212,255,0.05);
    transform: scale(1.05);
  }

  .mic-btn.recording {
    border-color: var(--red);
    box-shadow: 0 0 40px var(--red-dim), 0 0 80px rgba(255,59,92,0.15), inset 0 0 15px rgba(255,59,92,0.05);
    animation: mic-pulse 0.8s ease-in-out infinite;
  }

  @keyframes mic-pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }

  .mic-btn svg {
    width: 28px; height: 28px;
    transition: all 0.2s;
  }

  .mic-btn:not(.recording) svg { color: var(--cyan); filter: drop-shadow(0 0 4px var(--cyan)); }
  .mic-btn.recording svg { color: var(--red); filter: drop-shadow(0 0 8px var(--red)); }

  /* ── Mini stats row ── */
  .mini-stats {
    display: flex;
    gap: 20px;
    opacity: 0.5;
  }

  .mini-stat {
    text-align: center;
    font-size: 0.55rem;
    letter-spacing: 1.5px;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  .mini-stat span {
    display: block;
    font-size: 0.75rem;
    color: var(--cyan);
    font-family: 'Orbitron', sans-serif;
  }

  /* ═══════════════════════════════════
     RIGHT PANEL — TRANSCRIPT
  ═══════════════════════════════════ */
  .transcript-panel {
    grid-column: 2;
    grid-row: 2;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  .transcript-header {
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    font-size: 0.6rem;
    letter-spacing: 3px;
    color: var(--text-dim);
    text-transform: uppercase;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .transcript-header::before {
    content: '//';
    color: var(--cyan-dim);
    margin-right: 8px;
  }

  .msg-count {
    font-size: 0.55rem;
    color: var(--text-muted);
  }

  .transcript-body {
    flex: 1;
    overflow-y: auto;
    padding: 20px 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
  }

  /* Custom scrollbar */
  .transcript-body::-webkit-scrollbar { width: 3px; }
  .transcript-body::-webkit-scrollbar-track { background: transparent; }
  .transcript-body::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 2px; }

  /* ── Chat Bubbles ── */
  .bubble-wrap {
    display: flex;
    flex-direction: column;
    animation: bubble-in 0.3s ease forwards;
  }

  @keyframes bubble-in {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .bubble-wrap.user { align-items: flex-end; }
  .bubble-wrap.assistant { align-items: flex-start; }

  .bubble-label {
    font-size: 0.55rem;
    letter-spacing: 2px;
    margin-bottom: 5px;
    text-transform: uppercase;
  }

  .bubble-wrap.user .bubble-label { color: var(--purple); }
  .bubble-wrap.assistant .bubble-label { color: var(--cyan); }

  .bubble {
    max-width: 85%;
    padding: 12px 16px;
    font-size: 0.8rem;
    line-height: 1.65;
    position: relative;
    border: 1px solid transparent;
  }

  .bubble-wrap.user .bubble {
    background: linear-gradient(135deg, #1a1535, #12102a);
    border-color: rgba(124,58,237,0.3);
    box-shadow: 0 0 20px rgba(124,58,237,0.08);
    clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%);
  }

  .bubble-wrap.assistant .bubble {
    background: linear-gradient(135deg, #061820, #04121a);
    border-color: rgba(0,212,255,0.2);
    box-shadow: 0 0 20px rgba(0,212,255,0.06);
    clip-path: polygon(10px 0, 100% 0, 100% 100%, 0 100%, 0 10px);
  }

  .bubble-wrap.assistant.active .bubble {
    border-color: rgba(0,212,255,0.5);
    box-shadow: 0 0 25px rgba(0,212,255,0.12);
  }

  /* Streaming cursor */
  .cursor {
    display: inline-block;
    width: 2px; height: 1em;
    background: var(--cyan);
    margin-left: 2px;
    vertical-align: middle;
    animation: blink 0.7s infinite;
  }

  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

  /* Empty state */
  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    opacity: 0.3;
  }

  .empty-state svg { width: 40px; height: 40px; color: var(--cyan); }
  .empty-state p { font-size: 0.65rem; letter-spacing: 2px; color: var(--text-dim); }

  /* ═══════════════════════════════════
     BOTTOM — WAVEFORM
  ═══════════════════════════════════ */
  .waveform-bar {
    grid-column: 1 / -1;
    grid-row: 3;
    border-top: 1px solid var(--border);
    background: #040810;
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 16px;
    position: relative;
    overflow: hidden;
  }

  .waveform-bar::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(90deg, #040810 0%, transparent 10%, transparent 90%, #040810 100%);
    z-index: 2;
    pointer-events: none;
  }

  .wf-label {
    font-size: 0.5rem;
    letter-spacing: 2px;
    color: var(--text-muted);
    text-transform: uppercase;
    white-space: nowrap;
    z-index: 3;
  }

  canvas#waveform {
    flex: 1;
    height: 36px;
    z-index: 1;
  }

  .wf-time {
    font-size: 0.5rem;
    letter-spacing: 1px;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    z-index: 3;
  }

  /* ═══════════════════════════════════
     CORNER DECORATIONS
  ═══════════════════════════════════ */
  .corner {
    position: absolute;
    width: 16px; height: 16px;
    pointer-events: none;
  }

  .corner::before, .corner::after {
    content: '';
    position: absolute;
    background: var(--cyan);
    opacity: 0.5;
  }

  .corner-tl { top: 12px; left: 12px; }
  .corner-tl::before { top: 0; left: 0; width: 100%; height: 1px; }
  .corner-tl::after  { top: 0; left: 0; width: 1px; height: 100%; }

  .corner-tr { top: 12px; right: 12px; }
  .corner-tr::before { top: 0; right: 0; width: 100%; height: 1px; }
  .corner-tr::after  { top: 0; right: 0; width: 1px; height: 100%; }

  .corner-bl { bottom: 12px; left: 12px; }
  .corner-bl::before { bottom: 0; left: 0; width: 100%; height: 1px; }
  .corner-bl::after  { bottom: 0; left: 0; width: 1px; height: 100%; }

  .corner-br { bottom: 12px; right: 12px; }
  .corner-br::before { bottom: 0; right: 0; width: 100%; height: 1px; }
  .corner-br::after  { bottom: 0; right: 0; width: 1px; height: 100%; }

  /* ═══════════════════════════════════
     TOAST NOTIFICATIONS
  ═══════════════════════════════════ */
  .toast {
    position: fixed;
    top: 70px; left: 50%;
    transform: translateX(-50%) translateY(-10px);
    background: #0d1a24;
    border: 1px solid var(--red);
    color: var(--red);
    font-size: 0.65rem;
    letter-spacing: 2px;
    padding: 8px 20px;
    opacity: 0;
    transition: all 0.3s ease;
    pointer-events: none;
    z-index: 100;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .toast.info { border-color: var(--cyan); color: var(--cyan); }
</style>
</head>
<body>

<div id="app">

  <!-- ── HEADER ── -->
  <header>
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="16" cy="16" r="14" stroke="#00d4ff" stroke-width="1.5" opacity="0.4"/>
          <circle cx="16" cy="16" r="8" stroke="#00d4ff" stroke-width="1"/>
          <circle cx="16" cy="16" r="3" fill="#00d4ff" opacity="0.9"/>
          <line x1="16" y1="2" x2="16" y2="8" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
          <line x1="16" y1="24" x2="16" y2="30" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
          <line x1="2" y1="16" x2="8" y2="16" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
          <line x1="24" y1="16" x2="30" y2="16" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
        </svg>
      </div>
      <div>
        <div class="logo-text">ARIA</div>
        <div class="logo-sub">Adaptive Real-time Intelligence Assistant</div>
      </div>
    </div>
    <div class="header-right">
      <div class="connection-indicator">
        <div class="conn-dot" id="connDot"></div>
        <span id="connLabel">CONNECTING</span>
      </div>
      <button class="clear-btn" onclick="clearHistory()">Clear Session</button>
    </div>
  </header>

  <!-- ── LEFT: VOICE CORE ── -->
  <div class="voice-panel">
    <div class="corner corner-tl"></div>
    <div class="corner corner-bl"></div>

    <!-- Orb -->
    <div class="orb-container">
      <div class="ring ring-1"></div>
      <div class="ring ring-2"></div>
      <div class="ring ring-3"></div>
      <div class="ripples hidden" id="ripples">
        <div class="ripple ripple-1"></div>
        <div class="ripple ripple-2"></div>
        <div class="ripple ripple-3"></div>
      </div>
      <div class="orb-core" id="orbCore">
        <!-- ARIA icon -->
        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 8 L20 32" stroke="#00d4ff" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M12 14 L12 26" stroke="#00d4ff" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
          <path d="M28 14 L28 26" stroke="#00d4ff" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
          <path d="M6 18 L6 22" stroke="#00d4ff" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
          <path d="M34 18 L34 22" stroke="#00d4ff" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
        </svg>
      </div>
    </div>

    <!-- Status -->
    <div class="status-display">
      <div class="status-state" id="statusState">STANDBY</div>
      <div class="status-hint" id="statusHint">click mic to speak</div>
    </div>

    <!-- Mic Button -->
    <button class="mic-btn" id="micBtn" onclick="toggleRecording()">
      <svg id="micIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="23"/>
        <line x1="8" y1="23" x2="16" y2="23"/>
      </svg>
    </button>

    <!-- Mini stats -->
    <div class="mini-stats">
      <div class="mini-stat"><span id="statMsgs">0</span>messages</div>
      <div class="mini-stat"><span id="statModel">llama-3.1</span>model</div>
      <div class="mini-stat"><span id="statSTT">base</span>whisper</div>
    </div>
  </div>

  <!-- ── RIGHT: TRANSCRIPT ── -->
  <div class="transcript-panel">
    <div class="corner corner-tr"></div>
    <div class="corner corner-br"></div>

    <div class="transcript-header">
      <span>conversation log</span>
      <span class="msg-count" id="msgCount">0 exchanges</span>
    </div>

    <div class="transcript-body" id="transcriptBody">
      <div class="empty-state" id="emptyState">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        <p>no conversation yet</p>
        <p style="font-size:0.5rem; margin-top:-4px;">press mic to begin</p>
      </div>
    </div>
  </div>

  <!-- ── BOTTOM: WAVEFORM ── -->
  <div class="waveform-bar">
    <div class="wf-label">audio output</div>
    <canvas id="waveform"></canvas>
    <div class="wf-time" id="wfTime">00:00</div>
  </div>

</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════
let ws = null;
let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;
let isProcessing = false;
let messageCount = 0;
let currentAssistantBubble = null;
let currentAssistantText = '';

// Audio queue for sequential playback
let audioQueue = [];
let isPlayingAudio = false;
let audioContext = null;

// Waveform
let analyser = null;
let waveformAnimId = null;
let sessionSeconds = 0;
let sessionTimer = null;

// ═══════════════════════════════════════════════
//  WEBSOCKET
// ═══════════════════════════════════════════════
function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws`);

  ws.onopen = () => {
    setConnected(true);
    showToast('Connection established', 'info');
    startSessionTimer();
  };

  ws.onclose = () => {
    setConnected(false);
    setTimeout(connectWS, 3000);
  };

  ws.onerror = () => setConnected(false);

  ws.onmessage = (evt) => {
    const msg = JSON.parse(evt.data);
    handleMessage(msg);
  };
}

function setConnected(ok) {
  const dot = document.getElementById('connDot');
  const lbl = document.getElementById('connLabel');
  dot.className = 'conn-dot ' + (ok ? 'connected' : 'error');
  lbl.textContent = ok ? 'CONNECTED' : 'OFFLINE';
}

// ═══════════════════════════════════════════════
//  MESSAGE HANDLER
// ═══════════════════════════════════════════════
function handleMessage(msg) {
  switch (msg.type) {

    case 'status':
      setOrbState(msg.state);
      break;

    case 'transcript':
      if (msg.role === 'user') {
        addUserBubble(msg.text);
      } else if (msg.role === 'assistant') {
        appendAssistantText(msg.text, msg.streaming);
      }
      break;

    case 'audio_chunk':
      // Decode base64 MP3 and queue it
      const binary = atob(msg.audio);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      audioQueue.push(bytes.buffer);
      if (!isPlayingAudio) playNextAudio();
      break;

    case 'response_complete':
      finalizeAssistantBubble();
      break;

    case 'error':
      showToast(msg.message, 'error');
      setOrbState('idle');
      break;

    case 'history_cleared':
      clearTranscript();
      showToast('Session cleared', 'info');
      break;
  }
}

// ═══════════════════════════════════════════════
//  ORB STATE MACHINE
// ═══════════════════════════════════════════════
const stateConfig = {
  idle:         { label: 'STANDBY',      hint: 'click mic to speak',      class: '' },
  listening:    { label: 'LISTENING',    hint: 'recording your voice...',  class: 'listening' },
  transcribing: { label: 'TRANSCRIBING', hint: 'processing audio...',      class: 'thinking' },
  thinking:     { label: 'THINKING',     hint: 'generating response...',   class: 'thinking' },
  speaking:     { label: 'SPEAKING',     hint: 'playing response...',      class: 'speaking' },
};

function setOrbState(state) {
  const orb = document.getElementById('orbCore');
  const ripples = document.getElementById('ripples');
  const cfg = stateConfig[state] || stateConfig.idle;

  orb.className = 'orb-core ' + cfg.class;
  document.getElementById('statusState').textContent = cfg.label;
  document.getElementById('statusHint').textContent = cfg.hint;

  if (state === 'speaking') {
    ripples.classList.remove('hidden');
  } else {
    ripples.classList.add('hidden');
  }
}

// ═══════════════════════════════════════════════
//  RECORDING
// ═══════════════════════════════════════════════
async function toggleRecording() {
  if (isProcessing) return;

  if (!isRecording) {
    await startRecording();
  } else {
    stopRecording();
  }
}

async function startRecording() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioChunks = [];
    mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });

    mediaRecorder.ondataavailable = (e) => {
      if (e.data.size > 0) audioChunks.push(e.data);
    };

    mediaRecorder.onstop = () => {
      const blob = new Blob(audioChunks, { type: 'audio/webm' });
      blob.arrayBuffer().then(buf => {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(buf);
          isProcessing = true;
        }
      });
      stream.getTracks().forEach(t => t.stop());
    };

    mediaRecorder.start(250);
    isRecording = true;
    document.getElementById('micBtn').classList.add('recording');
    setOrbState('listening');

  } catch (e) {
    showToast('Microphone access denied', 'error');
  }
}

function stopRecording() {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
  }
  isRecording = false;
  isProcessing = true;
  document.getElementById('micBtn').classList.remove('recording');
  setOrbState('transcribing');
}

// ═══════════════════════════════════════════════
//  TRANSCRIPT
// ═══════════════════════════════════════════════
function addUserBubble(text) {
  hideEmptyState();
  currentAssistantBubble = null;
  currentAssistantText = '';

  const wrap = document.createElement('div');
  wrap.className = 'bubble-wrap user';
  wrap.innerHTML = `
    <div class="bubble-label">You</div>
    <div class="bubble">${escapeHTML(text)}</div>
  `;
  appendBubble(wrap);
  isProcessing = true;
}

function appendAssistantText(sentence, streaming) {
  hideEmptyState();

  if (!currentAssistantBubble) {
    // Create new assistant bubble
    const wrap = document.createElement('div');
    wrap.className = 'bubble-wrap assistant active';
    wrap.innerHTML = `
      <div class="bubble-label">ARIA</div>
      <div class="bubble"><span class="bubble-text"></span><span class="cursor"></span></div>
    `;
    appendBubble(wrap);
    currentAssistantBubble = wrap;
    currentAssistantText = '';
    messageCount++;
    updateCount();
  }

  currentAssistantText += (currentAssistantText ? ' ' : '') + sentence;
  currentAssistantBubble.querySelector('.bubble-text').textContent = currentAssistantText;
  scrollToBottom();
}

function finalizeAssistantBubble() {
  if (currentAssistantBubble) {
    // Remove cursor
    const cursor = currentAssistantBubble.querySelector('.cursor');
    if (cursor) cursor.remove();
    currentAssistantBubble.classList.remove('active');
    currentAssistantBubble = null;
  }
  isProcessing = false;
  setOrbState('idle');
}

function appendBubble(el) {
  const body = document.getElementById('transcriptBody');
  body.appendChild(el);
  scrollToBottom();
}

function scrollToBottom() {
  const body = document.getElementById('transcriptBody');
  body.scrollTop = body.scrollHeight;
}

function hideEmptyState() {
  const es = document.getElementById('emptyState');
  if (es) es.style.display = 'none';
}

function updateCount() {
  document.getElementById('msgCount').textContent = `${messageCount} exchanges`;
  document.getElementById('statMsgs').textContent = messageCount * 2;
}

function clearTranscript() {
  const body = document.getElementById('transcriptBody');
  body.innerHTML = `
    <div class="empty-state" id="emptyState">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      <p>no conversation yet</p>
      <p style="font-size:0.5rem; margin-top:-4px;">press mic to begin</p>
    </div>
  `;
  messageCount = 0;
  updateCount();
  currentAssistantBubble = null;
  currentAssistantText = '';
}

function clearHistory() {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'clear_history' }));
  }
  clearTranscript();
}

function escapeHTML(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ═══════════════════════════════════════════════
//  AUDIO PLAYBACK QUEUE
// ═══════════════════════════════════════════════
async function playNextAudio() {
  if (audioQueue.length === 0) {
    isPlayingAudio = false;
    return;
  }

  isPlayingAudio = true;
  const buffer = audioQueue.shift();

  try {
    if (!audioContext) {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
    }

    if (audioContext.state === 'suspended') await audioContext.resume();

    const decoded = await audioContext.decodeAudioData(buffer.slice(0));

    // Connect analyser for waveform
    if (!analyser) {
      analyser = audioContext.createAnalyser();
      analyser.fftSize = 256;
      analyser.connect(audioContext.destination);
    }

    const source = audioContext.createBufferSource();
    source.buffer = decoded;
    source.connect(analyser);

    source.onended = () => {
      playNextAudio();
    };

    source.start(0);

  } catch (e) {
    console.warn('Audio playback error:', e);
    playNextAudio();
  }
}

// ═══════════════════════════════════════════════
//  WAVEFORM CANVAS
// ═══════════════════════════════════════════════
function drawWaveform() {
  const canvas = document.getElementById('waveform');
  const ctx = canvas.getContext('2d');
  canvas.width = canvas.offsetWidth * window.devicePixelRatio;
  canvas.height = canvas.offsetHeight * window.devicePixelRatio;
  ctx.scale(window.devicePixelRatio, window.devicePixelRatio);

  const W = canvas.offsetWidth;
  const H = canvas.offsetHeight;

  function draw() {
    waveformAnimId = requestAnimationFrame(draw);
    ctx.clearRect(0, 0, W, H);

    if (analyser && isPlayingAudio) {
      const data = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteTimeDomainData(data);

      ctx.beginPath();
      ctx.strokeStyle = '#00d4ff';
      ctx.lineWidth = 1.5;
      ctx.shadowColor = '#00d4ff';
      ctx.shadowBlur = 6;

      const sliceW = W / data.length;
      let x = 0;

      for (let i = 0; i < data.length; i++) {
        const v = data[i] / 128.0;
        const y = (v * H) / 2;
        i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        x += sliceW;
      }
      ctx.stroke();
    } else {
      // Flat idle line
      ctx.beginPath();
      ctx.strokeStyle = 'rgba(0,212,255,0.15)';
      ctx.lineWidth = 1;
      ctx.moveTo(0, H / 2);
      ctx.lineTo(W, H / 2);
      ctx.stroke();

      // Occasional random tick
      if (Math.random() < 0.01) {
        const rx = Math.random() * W;
        const rh = (Math.random() * 8 + 2);
        ctx.beginPath();
        ctx.strokeStyle = 'rgba(0,212,255,0.3)';
        ctx.moveTo(rx, H/2 - rh);
        ctx.lineTo(rx, H/2 + rh);
        ctx.stroke();
      }
    }
  }

  draw();
}

// ═══════════════════════════════════════════════
//  SESSION TIMER
// ═══════════════════════════════════════════════
function startSessionTimer() {
  sessionTimer = setInterval(() => {
    sessionSeconds++;
    const m = String(Math.floor(sessionSeconds / 60)).padStart(2, '0');
    const s = String(sessionSeconds % 60).padStart(2, '0');
    document.getElementById('wfTime').textContent = `${m}:${s}`;
  }, 1000);
}

// ═══════════════════════════════════════════════
//  TOAST
// ═══════════════════════════════════════════════
let toastTimer = null;
function showToast(msg, type = 'error') {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = `toast ${type} show`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
}

// ═══════════════════════════════════════════════
//  KEYBOARD SHORTCUT — Hold SPACE to record
// ═══════════════════════════════════════════════
let spaceHeld = false;
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && !spaceHeld && !e.target.matches('input, textarea')) {
    spaceHeld = true;
    e.preventDefault();
    if (!isRecording && !isProcessing) startRecording();
  }
});

document.addEventListener('keyup', (e) => {
  if (e.code === 'Space') {
    spaceHeld = false;
    if (isRecording) stopRecording();
  }
});

// ═══════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════
window.addEventListener('load', () => {
  connectWS();
  drawWaveform();
  // Hint about spacebar
  document.getElementById('statusHint').textContent = 'click mic or hold SPACE';
});

window.addEventListener('resize', () => {
  const canvas = document.getElementById('waveform');
  const ctx = canvas.getContext('2d');
  canvas.width = canvas.offsetWidth * window.devicePixelRatio;
  canvas.height = canvas.offsetHeight * window.devicePixelRatio;
  ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
});
</script>
</body>
</html>
